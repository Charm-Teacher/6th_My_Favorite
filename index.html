<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>What are you going to do? · 6학년 9단원</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/innks/NanumSquareRound@master/nanumsquareround.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="hero">
    <div class="leaves" aria-hidden="true"></div>
    <div class="hero-inner">
      <p class="hero-unit">6학년 9단원 · 천재(함)</p>
      <h1 class="en">What are you going to do?</h1>
      <p class="hero-sub">🍁 나의 계획을 묻고 답해요 · <span class="en">I'm going to ___.</span></p>
    </div>
  </header>

  <nav class="tabs" role="tablist" aria-label="메뉴">
    <button class="tab active" role="tab" data-tab="beg" aria-selected="true">
      <span class="long">🎨 활동 카드 (초급)</span><span class="short">초급 카드</span>
    </button>
    <button class="tab" role="tab" data-tab="mid" aria-selected="false">
      <span class="long">🎨 활동 카드 (중급)</span><span class="short">중급 카드</span>
    </button>
    <button class="tab" role="tab" data-tab="practice" aria-selected="false">
      <span class="long">🎤 연습하기</span><span class="short">연습하기</span>
      <span class="badge" id="planBadge">0/5</span>
    </button>
  </nav>

  <main>
    <section class="panel active" id="panel-beg" role="tabpanel"></section>
    <section class="panel" id="panel-mid" role="tabpanel"></section>
    <section class="panel" id="panel-practice" role="tabpanel"></section>
  </main>

  <div class="word-bubble" id="wordBubble" hidden></div>

  <footer class="foot no-print">
    단어를 누르면 뜻과 발음이 나와요 · 말하기 채점은 Chrome + 마이크 허용이 필요해요
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
